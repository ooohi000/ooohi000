<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260">
  <style>.s{font-family:-apple-system,'Segoe UI','Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif}.m{font-family:'JetBrains Mono',Menlo,Consolas,monospace}
  .hl{animation:h 2.4s ease-out infinite alternate}@keyframes h{from{transform:scaleX(.15)}to{transform:scaleX(1)}}</style>
  <rect width="480" height="260" rx="18" fill="#fffef7" stroke="#1a1a1a" stroke-opacity=".12"/>
  <text x="32" y="44" class="m" font-size="12" fill="#8a8670" letter-spacing="2">LIVE · iOS</text>
  <g transform="translate(30 104)"><rect class="hl" width="232" height="26" y="-22" fill="#ffe94d" style="transform-origin:0 0"/></g>
  <text x="32" y="102" class="s" font-size="40" font-weight="800" fill="#111">큰글씨 가계부</text>
  <text x="32" y="148" class="s" font-size="17" fill="#3a3a3a">누구나 바로 쓰는 큰 글씨 가계부.</text>
  <text x="32" y="174" class="s" font-size="17" fill="#3a3a3a">중요한 것만 형광펜으로.</text>
  <text x="32" y="226" class="m" font-size="12" fill="#8a8670">No login · On-device · Expo + SQLite</text>
  <text x="430" y="226" class="s" font-size="22" fill="#111" text-anchor="end">→</text>
</svg>
