<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070c"/><stop offset="1" stop-color="#11101c"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#d9d4ff"/><stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#6d5dfc" stop-opacity="0.45"/><stop offset="1" stop-color="#6d5dfc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="r"><rect width="1000" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,'Segoe UI','Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
    .blink{animation:b 1.1s steps(1) infinite}@keyframes b{50%{opacity:0}}
    .orb{animation:f 9s ease-in-out infinite alternate}@keyframes f{to{transform:translate(-60px,30px)}}
    .scan{animation:s 6s linear infinite}@keyframes s{from{transform:translateY(-40px)}to{transform:translateY(360px)}}
  </style>
  <g clip-path="url(#r)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)"/>
    <rect class="orb" width="1000" height="320" fill="url(#glow)"/>
    <rect class="scan" x="0" y="0" width="1000" height="40" fill="#8b7bff" opacity="0.035"/>
    <text x="64" y="76" class="mono" font-size="14" fill="#8b7bff" letter-spacing="3">~/white0x  ·  INDIE APP MAKER  ·  SEOUL</text>
    <text x="60" y="186" class="sans" font-size="104" font-weight="800" fill="url(#txt)" letter-spacing="-4">white0x</text>
    <text x="64" y="238" class="sans" font-size="22" fill="#b9b6cc">기획하고, 만들고, 스토어에 올립니다.</text>
    <text x="64" y="276" class="mono" font-size="15" fill="#6f6b86">$ ship --platform ios --users everyone<tspan class="blink" fill="#8b7bff"> █</tspan></text>
    <g transform="translate(760 70)" class="mono" font-size="13">
      <rect width="176" height="110" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="22" cy="28" r="5" fill="#3ddc97"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="36" y="32" fill="#cfcbe6">2 apps live</text>
      <text x="22" y="62" fill="#6f6b86">App Store · KR</text>
      <text x="22" y="88" fill="#6f6b86">more shipping soon</text>
    </g>
  </g>
</svg>
